<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Badge matching user's logo -->
  <rect width="512" height="512" rx="112" fill="#fffaf0"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f97316" stroke-width="4" stroke-opacity="0.25"/>

  <g id="cartify-brand-mark">
    <!-- Shopping Cart Frame -->
    <path d="M 125 110 H 170 L 205 310 C 209 332 227 348 249 348 H 360 C 382 348 399 333 403 312 L 425 195 C 428 178 415 162 398 162 H 195" 
          fill="none" stroke="#18181b" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Cart Slats -->
    <path d="M 225 218 H 380" stroke="#18181b" stroke-width="24" stroke-linecap="round"/>
    <path d="M 240 274 H 360" stroke="#18181b" stroke-width="24" stroke-linecap="round"/>

    <!-- Wheels -->
    <circle cx="245" cy="395" r="22" fill="#18181b"/>
    <circle cx="360" cy="395" r="22" fill="#18181b"/>

    <!-- Orange Smile Swoosh Arrow -->
    <path d="M 105 375 C 180 460 300 460 395 385" 
          fill="none" stroke="#ea580c" stroke-width="32" stroke-linecap="round"/>
    <!-- Dynamic Arrowhead -->
